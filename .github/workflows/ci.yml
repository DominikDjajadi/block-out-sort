name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            tests: >-
              tests/test_conformance_fixtures.py
              tests/test_environment.py
              tests/test_eval_split.py
              tests/test_irregular_exits.py
              tests/test_oracle.py
              tests/test_parity_js.py
              tests/test_schema.py
              tests/test_search_core.py
              tests/test_search_puzzle.py
              tests/test_solver.py
              tests/test_unlocks.py
          - suite: training
            tests: >-
              tests/test_dataset.py
              tests/test_dataset_combine.py
              tests/test_resumable_dataset_generation.py
              tests/test_training_dataset.py
              tests/test_training_encoding.py
              tests/test_training_model.py
              tests/test_training_pool.py
              tests/test_training_run.py
          - suite: expert-iteration
            tests: tests/test_expert_iteration.py
          - suite: cotraining-core
            tests: >-
              tests/test_cotraining.py
              tests/test_experiment_identity.py
          - suite: research-tools
            tests: >-
              tests/test_budget_sweep.py
              tests/test_checkpoint_interpolation.py
              tests/test_cumulative_replay.py
              tests/test_designer.py
              tests/test_designer_calibration.py
              tests/test_export_zip.py
              tests/test_final_benchmark.py
              tests/test_frontier_promotion_evaluate.py
              tests/test_frontier_promotion_pool.py
              tests/test_latency_benchmark.py
              tests/test_midbudget_diagnostic.py
              tests/test_multi_transfer_audit.py
              tests/test_path_ablation.py
              tests/test_replay_anchor_pool.py
              tests/test_replay_anchor_sweep.py
              tests/test_retention.py
              tests/test_retention_search_trace.py
              tests/test_search_trace.py
              tests/test_search_utility.py
              tests/test_shadow_learner.py
              tests/test_successor_ranking.py
              tests/test_trace_ranking_pool.py
              tests/test_trace_ranking_sweep.py
              tests/test_transfer_audit.py
              tests/test_update_sweep.py
              tests/test_value_diagnostic.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ${{ matrix.suite }} tests
        working-directory: python
        run: pytest -q ${{ matrix.tests }}

  javascript-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript/Python conformance fixtures
        run: node tools/run_conformance.js
