[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocksort"
version = "0.1.0"
description = "Block Out Sort game environment (Python port of the JS engine)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "torch>=2.0", "numpy>=1.26"]
train = ["torch>=2.0", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blocksort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
